<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Doc Quality Auditor</title>
 <link rel="stylesheet" href="/static/styles.css" />
 <link rel="preconnect" href="https://fonts.googleapis.com" />
 <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
 <div class="app">
 <header class="topbar">
 <div class="brand">
 <span class="brand-icon">▣</span>
 <div>
 <h1>Doc Quality Auditor</h1>
 <p class="subtitle">Encounter note quality measure gap detection</p>
 </div>
 </div>
 <div class="actions">
 <button type="button" class="btn ghost" data-sample="encounter-note-good">Good note</button>
 <button type="button" class="btn ghost" data-sample="encounter-note-gaps">Gaps note</button>
 <button type="button" class="btn primary" id="auditBtn">Run audit</button>
 </div>
 </header>

 <div class="layout">
 <section class="panel input-panel">
 <div class="panel-head">
 <h2>Encounter note</h2>
 <label class="type-select">Type
 <select id="encounterType">
 <option value="office">Office visit</option>
 <option value="inpatient">Inpatient</option>
 <option value="ed">Emergency</option>
 </select>
 </label>
 </div>
 <textarea id="noteText" rows="18" placeholder="Paste clinical encounter note…"></textarea>
 </section>

 <section class="panel output-panel">
 <div class="summary-bar" id="summaryBar">
 <div class="sum-item"><span class="lbl">Compliance</span><span class="val" id="compliance"> - </span></div>
 <div class="sum-item pass"><span class="lbl">Passed</span><span class="val" id="passed"> - </span></div>
 <div class="sum-item gap"><span class="lbl">Gaps</span><span class="val" id="gaps"> - </span></div>
 </div>
 <div id="gapReport">
 <p class="placeholder">Paste a note and run audit to see quality measure gaps and suggested addenda.</p>
 </div>
 </section>
 </div>

 <footer class="footer">
 <p><strong>Demo only</strong> - rule-based documentation checks, not a certified quality reporting tool.</p>
 </footer>
 </div>
 <script src="/static/app.js"></script>
</body>
</html>
